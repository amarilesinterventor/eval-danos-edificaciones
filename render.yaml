# Blueprint de despliegue para Render (render.com).
#
# Plan "starter" + dos discos persistentes: la base de datos SQLite
# (data/edificaciones.sqlite) y las fotos subidas (public/uploads/) ya NO se
# reinician en cada redeploy/reinicio del servicio -- antes (plan "free",
# sin disco) sí se reiniciaban, y el servidor recargaba datos de ejemplo
# automáticamente (`autoSeedIfEmpty` en src/server/server.ts) para seguir
# funcional aunque los datos no persistieran. Esa función de auto-siembra
# sigue activa como red de seguridad (arranque en limpio, base de datos
# corrupta, etc.), pero ya no debería activarse en el uso normal.
#
# Ver docs/DESPLIEGUE.md para instrucciones completas / alternativas
# (PostgreSQL, almacenamiento en la nube para fotos).
services:
  - type: web
    name: eval-danos-edificaciones
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_OPTIONS
        value: --experimental-sqlite
      # AUTH_SECRET: no la usa ninguna ruta hoy (la herramienta no tiene
      # login — ver docs/ANALISIS-Y-ARQUITECTURA.md). Queda documentada aquí
      # como recordatorio para cuando se active control de acceso
      # multi-inspector/administrador (src/server/auth.ts ya está listo):
      # - key: AUTH_SECRET
      #   generateValue: true
    # Dos discos independientes -- cada uno con su propio punto de montaje
    # exacto, igual a la ruta que el código ya usa (src/db/db.ts: DATA_DIR;
    # src/server/server.ts: UPLOADS_DIR), así que no hace falta tocar código
    # ni variables de entorno adicionales para que esto funcione.
    disks:
      - name: eval-danos-data
        mountPath: /opt/render/project/src/data
        sizeGB: 1
      - name: eval-danos-uploads
        mountPath: /opt/render/project/src/public/uploads
        sizeGB: 1
