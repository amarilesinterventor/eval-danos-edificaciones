# Blueprint de despliegue para Render (render.com).
#
# Nivel "free": sin disco persistente, así que la base de datos SQLite y las
# fotos subidas se reinician en cada redeploy/reinicio del servicio. El
# servidor detecta esto y vuelve a cargar los datos de ejemplo automáticamente
# (ver autoSeedIfEmpty en src/server/server.ts), así que la app siempre
# arranca funcional aunque los datos no persistan entre reinicios.
#
# Para tener persistencia real (inspecciones y fotos que no se borren), hay
# que pasar a un plan pago y agregar un disco — ver el bloque comentado al
# final. Ver también docs/DESPLIEGUE.md para instrucciones completas.
services:
  - type: web
    name: eval-danos-edificaciones
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_OPTIONS
        value: --experimental-sqlite
      # AUTH_SECRET: no la usa ninguna ruta hoy (la herramienta no tiene
      # login — ver docs/ANALISIS-Y-ARQUITECTURA.md). Queda documentada aquí
      # como recordatorio para cuando se active control de acceso
      # multi-inspector/administrador (src/server/auth.ts ya está listo):
      # - key: AUTH_SECRET
      #   generateValue: true

# --- Para agregar persistencia (plan pago, ~$7/mes + disco) ---
# services:
#   - type: web
#     ...
#     plan: starter
#     disk:
#       name: eval-danos-data
#       mountPath: /opt/render/project/src/data
#       sizeGB: 1
# Nota: con esta configuración, /opt/render/project/src/public/uploads
# también debería apuntar a un disco persistente (o a almacenamiento externo
# tipo S3) para que las fotografías sobrevivan a los redeploys — ver
# docs/DESPLIEGUE.md, sección "Almacenamiento de fotografías en producción".
